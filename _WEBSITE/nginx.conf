server {
    listen 80;
    server_name _;

    root /site/out;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Refreshed independently of the site build by SCRIPTS/gen_leaderboard_data.py (cron),
    # so it lives outside the read-only build output and is never overwritten by a rebuild.
    location = /leaderboard-data.json {
        alias /usr/share/nginx/data/leaderboard-data.json;
        add_header Cache-Control "no-store";
    }

    # Next.js static export: /leaderboard -> leaderboard.html, /_next/* served as-is.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
